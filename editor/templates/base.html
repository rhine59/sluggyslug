<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf() }}"><title>{% block title %}SLUGS editor{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body><header><a href="{{ url_for('home') }}">SLUGS <small>WEBSITE EDITOR</small></a>{% if g.user %}<span>{{ g.user.username }} · {{ g.user.role }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button>Sign out</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
