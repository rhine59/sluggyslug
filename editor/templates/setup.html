{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Set up SLUGS editor.</h1><p>Create the first administrator. You can then add a separate account for each editor.</p><p>The one-time setup code is in the container’s private data folder. There is no default password.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>One-time setup code<input name="token" required autocomplete="off"></label><label>Administrator username<input name="username" value="richard" pattern="[A-Za-z0-9_.-]{3,40}" required autocomplete="username"></label><label>Password (at least 14 characters)<input name="password" type="password" minlength="14" maxlength="256" required autocomplete="new-password"></label><button class="primary">Create administrator</button></form></section>{% endblock %}
